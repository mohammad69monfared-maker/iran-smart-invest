name: Attach built APK to release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run id that produced the APK
        required: true
        default: '45228269985'
      tag:
        description: Release tag to attach the APK to
        required: true
        default: 'v1.3.0'
      asset:
        description: Asset filename on the release
        required: true
        default: 'iran-smart-invest-1.3.0.apk'
permissions:
  contents: write
  actions: read
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IranSmartInvest-android
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail
          APK=$(find apk -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets
