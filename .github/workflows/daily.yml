name: Daily market report
on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 0-3,6'
permissions:
  contents: read
concurrency:
  group: iran-smart-invest-daily
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared runtime dependencies
        run: |
          if test -f requirements.txt; then
            python -m pip install -r requirements.txt
          fi
      - name: Analyze and synchronize
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCAN_WORKERS: '8'
          SCAN_BUDGET_SECONDS: '2400'
        run: python -m engine
      - name: Send daily report
        if: ${{ !cancelled() && hashFiles('data/latest.json') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.notifications publish
